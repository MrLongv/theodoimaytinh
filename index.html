<!doctype html>
          <div class="label">Tổng tài sản</div>
          <div class="value" id="kpiTotal">0</div>
          <div class="note">Bao gồm thiết bị IT toàn công ty</div>
        </div>

        <div class="card kpi">
          <div class="label">Đang sử dụng</div>
          <div class="value" id="kpiUse">0</div>
          <div class="note">Đã cấp phát cho người dùng</div>
        </div>

        <div class="card kpi">
          <div class="label">Đang sửa</div>
          <div class="value" id="kpiRepair">0</div>
          <div class="note">Cần IT xử lý / theo dõi</div>
        </div>

        <div class="card kpi">
          <div class="label">Trong kho</div>
          <div class="value" id="kpiStock">0</div>
          <div class="note">Sẵn sàng cấp phát</div>
        </div>
      </div>

      <div class="grid content">
        <div class="card section">
          <div class="section-title">
            <h3>Tài sản mới cập nhật</h3>
            <small id="assetCountText"></small>
          </div>

          <div class="toolbar">
            <input class="field search" id="dashSearch" placeholder="Tìm mã, tên máy, người dùng, phòng ban..." oninput="renderDashboardTable()">

            <select class="field" id="dashStatus" onchange="renderDashboardTable()">
              <option value="">Tất cả trạng thái</option>
            </select>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Mã TS</th>
                  <th>Loại</th>
                  <th>Tên / cấu hình</th>
                  <th>Phòng ban</th>
                  <th>Người dùng</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="dashRows"></tbody>
            </table>
          </div>
        </div>

        <div class="card section">
          <div class="section-title">
            <h3>Hoạt động gần đây</h3>
            <small>Demo</small>
          </div>

          <div class="mini-list" id="activityList"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
